{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4 text-center">Каталог товарів</h1>

    {% if products %}
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            {% for product in products %}
                <div class="col">
                    <div class="card h-100 shadow-sm border-0">
                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title h5 mb-3">
                                <a href="{{ url_for('products.detailed', id=product.id) }}" class="text-decoration-none text-primary fw-bold">
                                    {{ product.name }}
                                </a>
                            </h3>
                            
                            <div class="mb-2">
                                <span class="badge bg-success fs-6">Ціна: {{ product.price }} грн</span>
                            </div>

                            <p class="card-text text-secondary small flex-grow-1">
                                {{ product.content }}
                            </p>

                            <a href="{{ url_for('products.detailed', id=product.id) }}" class="btn btn-outline-primary btn-sm mt-3 w-100">
                                Детальніше
                            </a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="alert alert-warning text-center shadow-sm" role="alert">
            На жаль, товари відсутні.
        </div>
    {% endif %}
</div>
{% endblock %}
