{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    {% if product %}
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="card-title h3 mb-3 text-primary fw-bold">{{ product.name }}</h1>
                        
                        <div class="mb-3">
                            <span class="badge bg-success fs-5">Ціна: {{ product.price }} грн</span>
                        </div>

                        <hr>

                        <p class="card-text text-secondary mb-4" style="line-height: 1.6;">
                            {{ product.content }}
                        </p>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('products.products') }}" class="btn btn-outline-secondary">
                                &larr; Назад до каталогу
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    {% else %}
        <div class="alert alert-danger text-center shadow-sm" role="alert">
            Товар не знайдено.
        </div>
        <div class="text-center mt-3">
            <a href="{{ url_for('products.products') }}" class="btn btn-primary">
                Повернутися до каталогу
            </a>
        </div>
    {% endif %}
</div>
{% endblock %}
