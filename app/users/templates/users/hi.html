{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <nav class="mb-4">
        <ul class="nav nav-pills gap-2">
            <li class="nav-item">
                <a class="nav-link"
                   href="{{ url_for('users.greetings', name='John', age=30) }}">
                    Greet John
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                   href="{{ url_for('users.admin') }}">
                    Admin
                </a>
            </li>
        </ul>
    </nav>

    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title">Hello, {{ name }}!</h2>

            {% if age %}
                <p class="card-text text-secondary mb-0">
                    You are {{ age }} years old.
                </p>
            {% else %}
                <p class="card-text text-muted mb-0">
                    Age is unknown.
                </p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
