{% extends "base.html" %}

{% block content %}
<section class="page-heading mb-4">
    <p class="eyebrow mb-2">Будьмо на зв'язку</p>
    <h1 class="display-5 fw-bold">Контакти</h1>
    <p class="text-secondary">Заповніть форму, щоб залишити повідомлення.</p>
</section>

<section class="content-narrow">
    <div class="mb-4">
        <p class="mb-1"><strong>Email</strong></p>
        <p class="text-secondary">bohdan.leonidov.24@pnu.edu.ua</p>
        <p class="mb-1"><strong>GitHub</strong></p>
        <p><a href="https://github.com/bohdawg" target="_blank" rel="noopener">Мій профіль GitHub</a></p>
    </div>

    <form>
        <div class="mb-3">
            <label for="name" class="form-label">Ім'я</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Повідомлення</label>
            <textarea class="form-control" id="message" name="message"
                      rows="5" required></textarea>
        </div>

        <button type="button" class="btn btn-dark">Надіслати</button>
        <p class="form-text">Демонстраційна форма: повідомлення не надсилається.</p>
    </form>
</section>
{% endblock %}
